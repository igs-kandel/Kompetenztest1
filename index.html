<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffbebe">
  <title>Lösungen Arbeitsplan 1</title>
  <style>
    :root { --pink:#ffbebe; --pink-dark:#e59191; --ink:#171717; --orange:#ef7d00; --green:#218c4a; --shadow:0 14px 34px rgba(80,20,20,.14); }
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh; color:var(--ink);
      font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
      background:radial-gradient(circle at 15% 0%,#ffe8e8 0,transparent 34rem),linear-gradient(180deg,var(--pink),#fff3f3 70%);
    }
    button { font:inherit; }
    .app { width:min(920px,calc(100% - 24px)); margin:0 auto; padding:28px 0 48px; }
    .panel {
      min-height:calc(100vh - 76px); padding:clamp(20px,4vw,38px);
      border:2px solid rgba(0,0,0,.84); border-radius:28px;
      background:rgba(255,253,253,.96); box-shadow:var(--shadow);
    }
    .view[hidden] { display:none; }
    .hero {
      margin:calc(-1 * clamp(20px,4vw,38px)); margin-bottom:30px; padding:34px 22px;
      border-radius:26px 26px 18px 18px; background:var(--pink); text-align:center;
    }
    h1,h2 { margin:0; line-height:1.2; }
    h1 { font-size:clamp(27px,6vw,44px); }
    h2 { font-size:clamp(23px,4.7vw,34px); }
    .subtitle { margin:10px 0 0; font-size:clamp(15px,2.8vw,18px); }
    .list { display:grid; gap:18px; }
    .chapter-button,.task-button {
      width:100%; border:2px solid var(--ink); border-radius:20px; cursor:pointer;
      text-align:center; transition:transform .14s ease,box-shadow .14s ease,filter .14s ease;
    }
    .chapter-button {
      min-height:82px; padding:20px 24px; background:var(--pink);
      box-shadow:0 8px 0 var(--pink-dark),0 13px 20px rgba(0,0,0,.12);
      font-size:clamp(18px,3vw,23px); font-weight:800;
    }
    .task-button {
      position:relative; min-height:66px; padding:16px 54px 16px 20px; background:white;
      box-shadow:0 6px 0 #d8d8d8,0 10px 16px rgba(0,0,0,.10);
      font-size:clamp(17px,3vw,21px); font-weight:750;
    }
    .task-button::after {
      content:"›"; position:absolute; top:50%; right:22px; transform:translateY(-52%);
      font-size:34px; line-height:1;
    }
    .chapter-button:hover,.task-button:hover { filter:brightness(1.025); transform:translateY(-2px); }
    .chapter-button:active,.task-button:active { transform:translateY(5px); box-shadow:0 2px 0 #cfcfcf; }
    button:focus-visible { outline:4px solid #356fd0; outline-offset:4px; }
    .topbar { display:grid; grid-template-columns:auto minmax(0,1fr) auto; align-items:center; gap:14px; margin-bottom:28px; }
    .topbar h2 { min-width:0; text-align:center; overflow-wrap:anywhere; }
    .topbar-spacer { width:46px; }
    .back {
      display:inline-flex; align-items:center; justify-content:center; width:46px; height:46px;
      border:2px solid var(--ink); border-radius:14px; background:var(--pink); cursor:pointer;
      box-shadow:0 5px 0 var(--pink-dark); font-size:25px; font-weight:900;
    }
    .back:active { transform:translateY(4px); box-shadow:0 1px 0 var(--pink-dark); }
    .solution-card {
      padding:clamp(14px,3vw,24px); border:5px solid var(--ink); border-radius:20px;
      background:white; box-shadow:0 10px 24px rgba(0,0,0,.12);
    }
    .solution-card.orange { border-color:var(--orange); }
    .solution-card.green { border-color:var(--green); }
    .solution-card img { display:block; width:auto; max-width:100%; height:auto; margin:0 auto; }
    .legend { display:flex; justify-content:center; gap:16px; flex-wrap:wrap; margin-top:24px; color:#4d4d4d; font-size:14px; }
    .legend span { display:inline-flex; align-items:center; gap:7px; }
    .dot { width:13px; height:13px; border:3px solid var(--ink); border-radius:4px; }
    .dot.orange { border-color:var(--orange); }
    .dot.green { border-color:var(--green); }
    @media (max-width:560px) {
      .app { width:min(100% - 12px,920px); padding:6px 0 18px; }
      .panel { min-height:calc(100vh - 12px); padding:18px 12px 28px; border-radius:22px; }
      .hero { margin:-18px -12px 24px; padding:30px 14px; border-radius:20px 20px 15px 15px; }
      .list { gap:15px; }
      .chapter-button { padding:18px 14px; border-radius:17px; }
      .topbar { grid-template-columns:44px 1fr 44px; gap:8px; }
      .back { width:42px; height:42px; }
      .solution-card { border-width:4px; padding:10px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="panel view" id="home-view">
      <div class="hero">
        <h1>Lösungen Arbeitsplan 1</h1>
        <p class="subtitle">Wähle zuerst ein Teilkapitel.</p>
      </div>
      <div class="list" id="chapter-list"></div>
    </section>
    <section class="panel view" id="chapter-view" hidden>
      <div class="topbar">
        <button class="back" id="chapter-back" type="button" aria-label="Zurück zur Startseite">←</button>
        <h2 id="chapter-title"></h2><span class="topbar-spacer" aria-hidden="true"></span>
      </div>
      <div class="list" id="task-list"></div>
      <div class="legend" aria-label="Bedeutung der Farben">
        <span><i class="dot"></i> normal</span>
        <span><i class="dot orange"></i> linke Seite (or.)</span>
        <span><i class="dot green"></i> rechte Seite (gr.)</span>
      </div>
    </section>
    <section class="panel view" id="solution-view" hidden>
      <div class="topbar">
        <button class="back" id="solution-back" type="button" aria-label="Zurück zu den Aufgaben">←</button>
        <h2 id="solution-title"></h2><span class="topbar-spacer" aria-hidden="true"></span>
      </div>
      <div class="solution-card" id="solution-card">
        <img id="solution-image" src="" alt="">
      </div>
    </section>
  </main>
  <script>
    const chapters = [
      { id:"gleichnamig", title:"Addieren und Subtrahieren gleichnamiger Brüche", tasks:[
        { id:"same-a", label:"Buch S. 44 Nr. A", image:"solutions/same-a.webp" },
        { id:"same-2", label:"Buch S. 44 Nr. 2", image:"solutions/same-2.webp" },
        { id:"same-4-or", label:"Buch S. 45 Nr. 4 or. a)–d)", image:"solutions/same-4-or.webp", frame:"orange" },
        { id:"same-5-or", label:"Buch S. 45 Nr. 5 or. a)–d)", image:"solutions/same-5-or.webp", frame:"orange" }
      ]},
      { id:"ungleichnamig", title:"Addieren und Subtrahieren ungleichnamiger Brüche", tasks:[
        { id:"unlike-3", label:"Buch S. 47 Nr. 3", image:"solutions/unlike-3.webp" },
        { id:"unlike-4-or", label:"Buch S. 47 Nr. 4 or.", image:"solutions/unlike-4-or.webp", frame:"orange" },
        { id:"unlike-6-or", label:"Buch S. 47 Nr. 6 or. a)–f)", image:"solutions/unlike-6-or.webp", frame:"orange" }
      ]},
      { id:"multiplizieren", title:"Multiplizieren von Brüchen", tasks:[
        { id:"multiply-3", label:"Buch S. 51 Nr. 3", image:"solutions/multiply-3.webp" },
        { id:"multiply-4-or", label:"Buch S. 51 Nr. 4 or.", image:"solutions/multiply-4-or.webp", frame:"orange" },
        { id:"multiply-ah22-2", label:"AH S. 22 Nr. 2", image:"solutions/multiply-ah22-2.webp" }
      ]},
      { id:"dividieren", title:"Dividieren von Brüchen", tasks:[
        { id:"divide-1", label:"Buch S. 53 Nr. 1", image:"solutions/divide-1.webp" },
        { id:"divide-2", label:"Buch S. 53 Nr. 2", image:"solutions/divide-2.webp" },
        { id:"divide-a", label:"Buch S. 54 Nr. A", image:"solutions/divide-a.webp" },
        { id:"divide-5-or", label:"Buch S. 54 Nr. 5 or. a), c), e)", image:"solutions/divide-5-or.webp", frame:"orange" }
      ]},
      { id:"punkt-vor-strich", title:"Punkt vor Strich. Klammern. Mit Brüchen", tasks:[
        { id:"order-1", label:"Buch S. 56 Nr. 1", image:"solutions/order-1.webp" },
        { id:"order-2", label:"Buch S. 56 Nr. 2", image:"solutions/order-2.webp" },
        { id:"order-a", label:"Buch S. 57 Nr. A", image:"solutions/order-a.webp" },
        { id:"order-ah24-1", label:"AH S. 24 Nr. 1", image:"solutions/order-ah24-1.webp" }
      ]}
    ];
    const homeView=document.querySelector("#home-view");
    const chapterView=document.querySelector("#chapter-view");
    const solutionView=document.querySelector("#solution-view");
    const chapterList=document.querySelector("#chapter-list");
    const taskList=document.querySelector("#task-list");
    const chapterTitle=document.querySelector("#chapter-title");
    const solutionTitle=document.querySelector("#solution-title");
    const solutionCard=document.querySelector("#solution-card");
    const solutionImage=document.querySelector("#solution-image");
    let activeChapter=null;
    function showOnly(view) {
      [homeView,chapterView,solutionView].forEach(item=>item.hidden=item!==view);
      window.scrollTo({top:0,behavior:"instant"});
    }
    function renderHome(updateHash=true) {
      activeChapter=null; showOnly(homeView);
      if(updateHash) history.pushState({view:"home"},"","#home");
    }
    function renderChapter(chapter,updateHash=true) {
      activeChapter=chapter; chapterTitle.textContent=chapter.title; taskList.replaceChildren();
      chapter.tasks.forEach(task=>{
        const button=document.createElement("button");
        button.type="button"; button.className="task-button"; button.textContent=task.label;
        button.addEventListener("click",()=>renderSolution(chapter,task)); taskList.append(button);
      });
      showOnly(chapterView);
      if(updateHash) history.pushState({view:"chapter",chapter:chapter.id},"",`#kapitel/${chapter.id}`);
    }
    function renderSolution(chapter,task,updateHash=true) {
      activeChapter=chapter; solutionTitle.textContent=task.label;
      solutionCard.className=`solution-card ${task.frame||""}`.trim();
      solutionImage.src=task.image; solutionImage.alt=`Lösung zu ${task.label}`; showOnly(solutionView);
      if(updateHash) history.pushState({view:"solution",chapter:chapter.id,task:task.id},"",`#loesung/${task.id}`);
    }
    chapters.forEach(chapter=>{
      const button=document.createElement("button");
      button.type="button"; button.className="chapter-button"; button.textContent=chapter.title;
      button.addEventListener("click",()=>renderChapter(chapter)); chapterList.append(button);
    });
    document.querySelector("#chapter-back").addEventListener("click",()=>renderHome());
    document.querySelector("#solution-back").addEventListener("click",()=>renderChapter(activeChapter));
    function restoreFromHash() {
      const hash=location.hash;
      if(hash.startsWith("#kapitel/")) {
        const chapter=chapters.find(item=>item.id===hash.split("/")[1]);
        if(chapter) return renderChapter(chapter,false);
      }
      if(hash.startsWith("#loesung/")) {
        const id=hash.split("/")[1];
        for(const chapter of chapters) {
          const task=chapter.tasks.find(item=>item.id===id);
          if(task) return renderSolution(chapter,task,false);
        }
      }
      renderHome(false);
    }
    window.addEventListener("popstate",restoreFromHash);
    history.replaceState({view:"initial"},"",location.hash||"#home");
    restoreFromHash();
  </script>
</body>
</html>
